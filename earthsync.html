<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EarthSync</title>
<style>
:root{
  --bg:#14171a;--panel:#1c2024;--panel2:#242a2f;--line:#323a41;--txt:#e8e6e1;--mut:#9aa3aa;
  --acc:#f2a93b;--acc2:#4fb3a5;--ok:#6cc487;--warn:#f2a93b;--bad:#e5645f;--info:#7aa2f7;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){--bg:#f3f1ec;--panel:#fff;--panel2:#ece9e2;--line:#d6d1c6;--txt:#22262a;--mut:#69727a;--acc:#b86e00;--acc2:#1f8277;--ok:#2a8a4b;--warn:#b86e00;--bad:#c23b36;--info:#3b62c4}
}
:root[data-theme="light"]{--bg:#f3f1ec;--panel:#fff;--panel2:#ece9e2;--line:#d6d1c6;--txt:#22262a;--mut:#69727a;--acc:#b86e00;--acc2:#1f8277;--ok:#2a8a4b;--warn:#b86e00;--bad:#c23b36;--info:#3b62c4}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0;letter-spacing:.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 small{color:var(--mut);font-weight:400;margin-left:6px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mut);flex:none}
.dot.on{background:var(--ok)}.dot.off{background:var(--bad)}
#stat{font-size:12px;color:var(--mut)}
main{flex:1;min-height:0;position:relative}
.tab{position:absolute;inset:0;overflow:auto;padding:14px 16px 24px;display:none;-webkit-overflow-scrolling:touch}
.tab.on{display:block}
.tab.fill{padding:0;overflow:hidden}
nav{display:flex;border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:12px 2px;font:600 12px system-ui;letter-spacing:.04em;text-transform:uppercase;border-top:3px solid transparent;cursor:pointer}
nav button.on{color:var(--acc);border-top-color:var(--acc)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:20px 0 8px;font-weight:700}
h2:first-child{margin-top:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat .v{font:600 26px var(--mono);line-height:1.1}
.stat .l{font-size:12px;color:var(--mut);margin-top:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.mut{color:var(--mut)}.mono{font-family:var(--mono)}
.badge{display:inline-block;font:600 11px system-ui;padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.b-prior{color:var(--mut)}.b-approved{color:var(--ok)}.b-approved_open{color:var(--warn)}.b-rejected{color:var(--bad)}.b-pending{color:var(--info)}
button.btn,.btn{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:600 13px system-ui;cursor:pointer}
button.btn.pri{background:var(--acc);color:#1a1200;border-color:var(--acc)}
button.btn.dng{color:var(--bad)}
button.btn.sm{padding:4px 9px;font-size:12px}
button.btn.on{outline:2px solid var(--acc)}
input,select,textarea{background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;max-width:100%}
input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:var(--acc)}
textarea{width:100%;min-height:80px;font-family:var(--mono);font-size:13px}
label.f{display:block;margin-bottom:10px;font-size:12px;color:var(--mut)}
label.f>input:not([type=checkbox]),label.f>select,label.f>textarea{display:block;width:100%;margin-top:4px;color:var(--txt);font-size:15px}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:4px 0}
.bar>i{display:block;height:100%;background:var(--acc2)}
.bar.cut>i{background:var(--bad)}.bar.fill>i{background:var(--info)}
.item{display:flex;gap:8px;align-items:flex-start;padding:5px 0}
.item.done span{text-decoration:line-through;color:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.warn{border-left:4px solid var(--warn)}
.bad{border-left:4px solid var(--bad)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
td.n,th.n{text-align:right;font-family:var(--mono)}
td input{width:100%;min-width:70px;padding:4px 6px}
.tbl{overflow-x:auto}
#planWrap{position:absolute;inset:0;display:flex;flex-direction:column}
#planBar{display:flex;gap:6px;flex-wrap:wrap;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);align-items:center}
#planBox{flex:1;position:relative;min-height:0}
#plan{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#planInfo{position:absolute;left:8px;bottom:8px;right:8px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:12px var(--mono);pointer-events:none}
#threeWrap{position:absolute;inset:0;display:flex;flex-direction:column}
#three{flex:1;position:relative;min-height:0}
#three canvas{display:block;width:100%;height:100%;touch-action:none}
#threeMsg{position:absolute;left:10px;top:10px;right:10px;padding:8px 12px;border-radius:8px;background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--warn);font-size:13px}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:16px}
@media(min-width:700px){.modalbg{align-items:center}.modal{border-radius:14px}}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
</style>
</head>
<body>
<header>
  <h1 id="title">EarthSync<small>Earthworks QA</small></h1>
  <span id="stat">connecting…</span><span class="dot" id="dot"></span>
</header>
<main>
  <section class="tab on" id="t-home"></section>
  <section class="tab fill" id="t-plan">
    <div id="planWrap">
      <div id="planBar"></div>
      <div id="planBox"><canvas id="plan"></canvas><div id="planInfo">Tap a control point for details</div></div>
    </div>
  </section>
  <section class="tab" id="t-wir"></section>
  <section class="tab" id="t-check"></section>
  <section class="tab" id="t-vol"></section>
  <section class="tab fill" id="t-3d">
    <div id="threeWrap">
      <div id="threeBar" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)"></div>
      <div id="three"></div>
    </div>
  </section>
  <section class="tab" id="t-data"></section>
</main>
<nav id="nav"></nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* =====================================================================
   EarthSync — earthworks (cut & fill) QA tracker
   Single file. Data: Firebase RTDB over REST/SSE with localStorage cache.
   Dynamic DOM is built with h() + addEventListener (no inline handlers).
   ===================================================================== */
const DB_URL='https://valetsitetrack-default-rtdb.europe-west1.firebasedatabase.app/';
const ROOT='earthsync_site/';
const CTRL_BASE=[[1,2763383.11,667322.387],[2,2760361.552,669115.225],[3,2760376.249,669077.081],[4,2760383.093,669055.928],[5,2760393.842,669014.983],[6,2760400.496,668985.216],[7,2760411.297,668936.904],[8,2760422.459,668886.966],[9,2760439.184,668812.161],[10,2760459.766,668720.09],[11,2760474.02,668656.331],[12,2760482.839,668622.672],[13,2760504.977,668565.493],[14,2760529.655,668520.531],[15,2760551.623,668488.941],[16,2760594.286,668441.114],[17,2760621.253,668416.226],[18,2760899.946,668160.855],[19,2760933.436,668126.489],[20,2760978.014,668070.008],[21,2761009.089,668019.794],[22,2761046.262,667937.478],[23,2761095.21,667801.511],[24,2761112.827,667752.574],[25,2761118.517,667736.77],[26,2761128.238,667707.294],[27,2761142.166,667650.563],[28,2761148.917,667606.158],[29,2761151.969,667566.87],[30,2761152.0,667517.872],[31,2761148.0,667470.156],[32,2761134.199,667398.067],[33,2761120.36,667352.441],[34,2761059.409,667177.896],[35,2761034.333,667106.087],[36,2761022.633,667069.731],[37,2761013.56,667024.056],[38,2761008.678,666979.472],[39,2760869.259,667071.347],[40,2760500.381,667334.309],[41,2760216.214,667558.275],[42,2760076.901,667672.62],[43,2759948.053,667771.977],[44,2759881.54,667820.753],[45,2759760.493,667905.371],[46,2759635.093,667987.671],[47,2759545.227,668043.465],[48,2759484.793,668079.637],[49,2759409.818,668123.585],[50,2759421.878,668167.269],[51,2759434.702,668229.886],[52,2759439.017,668290.011],[53,2759442.764,668493.976],[54,2759444.828,668623.029],[55,2759441.437,668697.993],[56,2759424.062,668816.752],[57,2759401.54,668903.855],[58,2759373.514,668982.573],[59,2759280.992,669210.96],[60,2759160.804,669507.642],[61,2758990.124,669928.96]];            // [[no, northing, easting], ...] from PNEZ_Points.csv
const COL=['#f2a93b','#4fb3a5','#7aa2f7','#d9737f'];
const STATUS={prior:'Before my QA',approved:'Approved',approved_open:'Approved – open item',rejected:'Rejected / redo',pending:'Pending'};
const DESIGN_URL='m4_design.json';
const ACTIVITIES=['Clearing & grubbing','Excavation (cut)','Fill / embankment','Compaction','Grading / trimming','Survey / levels','Other'];

/* ---------- tiny helpers ---------- */
const $=s=>document.querySelector(s);
function h(t,a={},...k){
  const e=document.createElement(t);
  for(const [x,v] of Object.entries(a)){
    if(v===false||v==null)continue;
    if(x==='class')e.className=v;
    else if(x==='style')e.style.cssText=v;
    else if(x.startsWith('on'))e.addEventListener(x.slice(2),v);
    else if(x==='value'||x==='checked'||x==='selected'||x==='disabled')e[x]=v;
    else e.setAttribute(x,v===true?'':v);
  }
  for(const c of k.flat(Infinity))if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(String(c)));
  return e;
}
const fmt=(n,d=0)=>Number(n||0).toLocaleString('en',{maximumFractionDigits:d,minimumFractionDigits:d});
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const today=()=>new Date().toISOString().slice(0,10);
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ---------- state ---------- */
let S=lsGet('es_state',null)||{};
let pending=lsGet('es_pending',[]);   // writes not yet confirmed by the cloud
normalize();
function normalize(){for(const k of ['ctrl','phases','wirs','cf','meta','checks'])if(!S[k]||typeof S[k]!=='object')S[k]={}}
function setAt(o,parts,val){
  for(let i=0;i<parts.length-1;i++){if(typeof o[parts[i]]!=='object'||o[parts[i]]===null)o[parts[i]]={};o=o[parts[i]]}
  const k=parts[parts.length-1];
  if(val===null||val===undefined)delete o[k];else o[k]=val;
}
function seedWirs(){
  const w={};
  for(let i=1;i<=21;i++)w[i]={no:i,date:'',activity:'Earthwork',phase:0,loc:'',status:'prior',mine:false,notes:'Completed by contractor before my QA started. Details to be added from the WIR file.'};
  w[22]={no:22,date:'2026-10-13',activity:'Grading / trimming',phase:1,loc:'',ref:'M4P1-003',layer:2,status:'approved_open',mine:true,
    notes:'Contractor WIR for the new layer (layer 2) placed in zone M4P1-003. Checked on site: grading is OK except the eastern side.',
    items:{i1:{t:'Eastern side: 1 m width not graded',done:false}}};
  return w;
}
if(!Object.keys(S.wirs).length){S.wirs=seedWirs();S.meta.seededLocal=true}
const ph=id=>Object.assign({name:'Phase '+id,color:COL[id-1],targetHa:0,targetCut:0,targetFill:0,poly:''},S.phases[id]||{});

/* ---------- persistence: local cache + Firebase REST ---------- */
let online=false,es=null;
const cache=()=>lsSet('es_state',S);
function setStatus(on,msg){
  online=on;$('#dot').className='dot '+(on?'on':'off');
  $('#stat').textContent=msg||(on?'live':'offline'+(pending.length?` · ${pending.length} queued`:''));
}
const url=p=>DB_URL+(ROOT+p).replace(/\/$/,'')+'.json';
function put(path,val){            // specific-path write (never replaces a whole collection)
  setAt(S,path.split('/'),val);cache();renderAll();
  pending.push({m:'PUT',p:path,v:val===undefined?null:val});lsSet('es_pending',pending);flush();
}
function patch(path,obj){
  for(const [k,v] of Object.entries(obj))setAt(S,(path?path+'/':'').concat(k).split('/'),v);
  cache();renderAll();
  pending.push({m:'PATCH',p:path,v:obj});lsSet('es_pending',pending);flush();
}
let flushing=false;
async function flush(){
  if(flushing)return;flushing=true;
  try{
    while(pending.length){
      const w=pending[0];
      const r=await fetch(url(w.p),{method:w.m,body:JSON.stringify(w.v)});
      if(!r.ok)throw new Error(r.status);
      pending.shift();lsSet('es_pending',pending);
    }
    setStatus(true);
  }catch(e){setStatus(false)}
  flushing=false;
}
function applyRemote(path,data){
  const parts=path.split('/').filter(Boolean);
  if(!parts.length){
    if(data&&typeof data==='object'&&Object.keys(data).length){
      S=data;normalize();
      if(!Object.keys(S.wirs).length){S.wirs=seedWirs();patch('',{wirs:S.wirs,meta:Object.assign({},S.meta,{seeded:true})})}
    }else{
      // empty cloud: publish what we have (seeded WIRs + any local edits)
      normalize();
      patch('',{wirs:S.wirs,phases:S.phases,ctrl:S.ctrl,cf:S.cf,meta:Object.assign({},S.meta,{seeded:true})});
    }
  }else setAt(S,parts,data);
  cache();renderAll();
}
function listen(){
  try{
    es=new EventSource(url(''));
    es.addEventListener('put',e=>{setStatus(true);const d=JSON.parse(e.data);applyRemote(d.path,d.data);if(pending.length)flush()});
    es.addEventListener('patch',e=>{const d=JSON.parse(e.data);for(const [k,v] of Object.entries(d.data||{}))applyRemote((d.path==='/'?'':d.path)+'/'+k,v)});
    es.onerror=()=>setStatus(false);
    es.onopen=()=>setStatus(true);
  }catch(e){setStatus(false)}
}
window.addEventListener('online',()=>{flush();if(!es||es.readyState===2)listen()});

/* ---------- design surface (M4 grading points, 10 m grid, phases P1-P4) ---------- */
let DES=null,rast=null;
const GS=20;
const RAMP=[[.16,.42,.48],[.35,.62,.45],[.78,.72,.40],[.80,.48,.28],[.95,.92,.88]];
function rampRGB(t){
  t=Math.max(0,Math.min(1,t))*(RAMP.length-1);
  const i=Math.min(RAMP.length-2,Math.floor(t)),u=t-i,a=RAMP[i],b=RAMP[i+1];
  return [a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u,a[2]+(b[2]-a[2])*u];
}
const rampCss=t=>'rgb('+rampRGB(t).map(x=>Math.round(x*255)).join(',')+')';
function buildDesign(j){
  let n=0;for(const p of Object.values(j.phases))n+=p.e.length;
  const D={n,E:new Float64Array(n),N:new Float64Array(n),Z:new Float64Array(n),P:new Uint8Array(n),grid:new Map(),
    cellArea:j.cellArea||98.3,ph:{},zmin:1e9,zmax:-1e9,e0:1e12,e1:-1e12,n0:1e12,n1:-1e12};
  let k=0;
  for(const [key,p] of Object.entries(j.phases)){
    D.ph[key]={n:p.e.length,areaHa:p.areaHa,zmin:p.zmin,zmax:p.zmax,rings:p.rings||[]};
    const pn=parseInt(key.slice(1))||0;
    for(let i=0;i<p.e.length;i++,k++){
      const E=j.E0+p.e[i]/10,N=j.N0+p.n_[i]/10,Z=j.Z0+p.z[i]/1000;
      D.E[k]=E;D.N[k]=N;D.Z[k]=Z;D.P[k]=pn;
      if(E<D.e0)D.e0=E;if(E>D.e1)D.e1=E;if(N<D.n0)D.n0=N;if(N>D.n1)D.n1=N;if(Z<D.zmin)D.zmin=Z;if(Z>D.zmax)D.zmax=Z;
      const gk=Math.floor(E/GS)*200000+Math.floor(N/GS);
      let a=D.grid.get(gk);if(!a){a=[];D.grid.set(gk,a)}a.push(k);
    }
  }
  return D;
}
function designAt(e,n){
  if(!DES)return null;
  const ix=Math.floor(e/GS),iy=Math.floor(n/GS),c=[];
  for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){
    const l=DES.grid.get((ix+a)*200000+iy+b);
    if(l)for(const i of l){const d=(DES.E[i]-e)**2+(DES.N[i]-n)**2;if(d<=400)c.push([d,i])}
  }
  if(!c.length)return null;
  c.sort((x,y)=>x[0]-y[0]);
  if(c[0][0]>144)return null;                       // more than 12 m from any design point = outside the design
  if(c[0][0]<.01)return {z:DES.Z[c[0][1]],ph:DES.P[c[0][1]]};
  let sw=0,s=0;for(const [d,i] of c.slice(0,4)){sw+=1/d;s+=DES.Z[i]/d}
  return {z:s/sw,ph:DES.P[c[0][1]]};
}
function phaseRings(i){
  const m=parsePoly(ph(i).poly);if(m.length>2)return [m];
  return DES&&DES.ph['P'+i]?DES.ph['P'+i].rings:[];
}
function phaseHa(i){
  const m=parsePoly(ph(i).poly);if(m.length>2)return polyArea(m)/1e4;
  return DES&&DES.ph['P'+i]?DES.ph['P'+i].areaHa:0;
}
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('earthsync',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbGet(){try{const d=await idb();return await new Promise(res=>{const q=d.transaction('kv').objectStore('kv').get('design');q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}catch(e){return null}}
async function idbSet(v){try{const d=await idb();d.transaction('kv','readwrite').objectStore('kv').put(v,'design')}catch(e){}}
function setDesign(j,save){
  DES=buildDesign(j);rast=null;dirty3D=true;if(save)idbSet(j);
  if(!view.set)fitPlan();
  renderAll();
}
async function loadDesign(){
  let j=null;
  try{const r=await fetch(DESIGN_URL);if(r.ok)j=await r.json()}catch(e){}
  if(!j)j=await idbGet();
  if(j)setDesign(j,false);
}
function buildRaster(){
  const PXs=5,W=Math.ceil((DES.e1-DES.e0)/PXs)+3,H=Math.ceil((DES.n1-DES.n0)/PXs)+3;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');
  const pal=[];for(let i=0;i<48;i++)pal.push(rampCss(i/47));
  const span=DES.zmax-DES.zmin||1;
  for(let i=0;i<DES.n;i++){
    c.fillStyle=pal[Math.round((DES.Z[i]-DES.zmin)/span*47)];
    c.fillRect((DES.E[i]-DES.e0)/PXs,H-3-(DES.N[i]-DES.n0)/PXs,2.4,2.4);
  }
  rast={cv,PXs,e0:DES.e0,top:DES.n0+(H-3)*PXs+PXs};
}

/* ---------- control points ---------- */
function ctrlList(){
  const m={};
  for(const [n,N,E] of CTRL_BASE)m[n]={n,N,E,z:null};
  for(const [k,v] of Object.entries(S.ctrl)){
    const n=+k;m[n]=Object.assign(m[n]||{n,N:null,E:null,z:null},v,{n});
  }
  const L=Object.values(m).filter(p=>p.N!=null&&p.E!=null).sort((a,b)=>a.n-b.n);
  for(const p of L){ // outlier flag: nearest neighbour > 1 km
    let best=1e9;for(const q of L)if(q!==p)best=Math.min(best,Math.hypot(p.E-q.E,p.N-q.N));
    p.out=best>1000;p.nn=best;
  }
  return L;
}
function polyArea(pts){let a=0;for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[(i+1)%pts.length];a+=p[0]*q[1]-q[0]*p[1]}return Math.abs(a)/2}
function parsePoly(s){return (s||'').split(';').filter(Boolean).map(t=>t.split(',').map(Number))}
function polyStr(a){return a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(';')}

/* ---------- volumes ---------- */
function cfList(){return Object.entries(S.cf).map(([id,v])=>Object.assign({id},v)).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.id.localeCompare(a.id))}
function phaseDone(id){
  let cut=0,fill=0;
  for(const c of cfList())if(+c.phase===id){if(c.type==='cut')cut+=+c.vol||0;else fill+=+c.vol||0}
  return {cut,fill};
}
const pct=(d,t)=>t>0?Math.min(100,d/t*100):0;

function editWir(w){
  const isNew=!w;
  const no=isNew?Math.max(0,...Object.keys(S.wirs).map(Number))+1:w.no;
  w=w||{no,date:today(),activity:ACTIVITIES[4],phase:0,loc:'',status:'pending',mine:true,notes:'',items:{}};
  const f={};
  const sel=(k,opts,val)=>f[k]=h('select',{},...opts.map(([v,l])=>h('option',{value:v,selected:String(v)===String(val)},l)));
  const inp=(k,type,val)=>f[k]=h('input',{type,value:val==null?'':val});
  const body=h('div',{},
    h('label',{class:'f'},'WIR number',inp('no','number',no)),
    h('label',{class:'f'},'WIR name / reference',inp('ref','text',w.ref)),
    h('label',{class:'f'},'Layer no.',inp('layer','number',w.layer)),
    h('label',{class:'f'},'Date',inp('date','date',w.date)),
    h('label',{class:'f'},'Activity',sel('activity',ACTIVITIES.map(a=>[a,a]),w.activity)),
    h('label',{class:'f'},'Phase',sel('phase',[[0,'—'],[1,'Phase 1'],[2,'Phase 2'],[3,'Phase 3'],[4,'Phase 4']],w.phase)),
    h('label',{class:'f'},'Location / zone',inp('loc','text',w.loc)),
    h('label',{class:'f'},'Status',sel('status',Object.entries(STATUS),w.status)),
    h('label',{class:'f row'},inp('mine','checkbox'),'Checked by me on site'),
    h('label',{class:'f'},'Notes',f.notes=h('textarea',{value:w.notes||''})),
    h('label',{class:'f'},'Open items (one per line; delete a line to remove it)',
      f.items=h('textarea',{value:Object.values(w.items||{}).map(i=>i.t).join('\n')})));
  f.mine.checked=!!w.mine;
  modal((isNew?'New':'Edit')+' WIR',body,close=>[
    h('button',{class:'btn pri',onclick:()=>{
      const n=+f.no.value;if(!n){alert('Enter a WIR number');return}
      const old=S.wirs[n]&&n!==w.no?'exists':'';
      if(old&&!confirm('WIR '+n+' already exists. Overwrite?'))return;
      const prev=Object.entries(w.items||{});
      const items={};let k=0;
      for(const line of f.items.value.split('\n').map(s=>s.trim()).filter(Boolean)){
        const m=prev.find(([id,i])=>i.t===line&&!items[id]);
        const id=m?m[0]:'i'+Date.now().toString(36)+(k++);
        items[id]={t:line,done:m?!!m[1].done:false};
      }
      let status=f.status.value;
      if(status==='approved'&&Object.values(items).some(i=>!i.done))status='approved_open';
      put('wirs/'+n,{no:n,ref:f.ref.value.trim(),layer:+f.layer.value||0,date:f.date.value,activity:f.activity.value,phase:+f.phase.value,loc:f.loc.value,status,mine:f.mine.checked,notes:f.notes.value,items});
      if(n!==w.no&&!isNew)put('wirs/'+w.no,null);
      close();
    }},'Save'),
    h('button',{class:'btn',onclick:close},'Cancel'),
    isNew?null:h('button',{class:'btn dng',onclick:()=>{if(confirm('Delete WIR '+w.no+'?')){put('wirs/'+w.no,null);close()}}},'Delete')]);
}

/* =====================================================================
   PLAN (2D canvas)
   ===================================================================== */
const view={cx:0,cy:0,k:0.1,set:false};
const plan={cv:$('#plan'),ctx:null,w:0,h:0,dpr:1,labels:true,line:true,showDes:true,check:[],draw:false,drawPhase:1,draft:[],sel:null};
plan.ctx=plan.cv.getContext('2d');
function sizePlan(){
  const b=$('#planBox');plan.dpr=window.devicePixelRatio||1;
  plan.w=b.clientWidth;plan.h=b.clientHeight;
  plan.cv.width=plan.w*plan.dpr;plan.cv.height=plan.h*plan.dpr;
}
function bboxCtrl(){
  if(DES)return {e0:DES.e0,e1:DES.e1,n0:DES.n0,n1:DES.n1};
  const C=ctrlList().filter(p=>!p.out);const A=C.length?C:ctrlList();
  if(!A.length)return {e0:0,e1:1,n0:0,n1:1};
  return {e0:Math.min(...A.map(p=>p.E)),e1:Math.max(...A.map(p=>p.E)),n0:Math.min(...A.map(p=>p.N)),n1:Math.max(...A.map(p=>p.N))};
}
function fitPlan(){
  if(!plan.w||!plan.h){view.set=false;return}
  const b=bboxCtrl();
  view.cx=(b.e0+b.e1)/2;view.cy=(b.n0+b.n1)/2;
  view.k=Math.min(plan.w/((b.e1-b.e0)*1.15||1),plan.h/((b.n1-b.n0)*1.15||1));view.set=true;
}
const toS=(e,n)=>[plan.w/2+(e-view.cx)*view.k,plan.h/2-(n-view.cy)*view.k];
const toW=(x,y)=>[view.cx+(x-plan.w/2)/view.k,view.cy-(y-plan.h/2)/view.k];
function niceStep(px){const t=px/view.k;for(const s of [10,20,50,100,200,500,1000,2000,5000,10000])if(s>=t)return s;return 10000}
function drawPlan(){
  if(cur!=='plan'||!plan.w||!(view.k>0))return;
  const c=plan.ctx;c.setTransform(plan.dpr,0,0,plan.dpr,0,0);
  c.fillStyle=cssv('--bg');c.fillRect(0,0,plan.w,plan.h);
  const line=cssv('--line'),mut=cssv('--mut'),txt=cssv('--txt'),acc=cssv('--acc'),bad=cssv('--bad');
  // grid
  const st=niceStep(90),[w0,w1]=[toW(0,plan.h),toW(plan.w,0)];
  c.lineWidth=1;c.strokeStyle=line;c.fillStyle=mut;c.font='10px ui-monospace,monospace';c.textAlign='left';
  for(let e=Math.ceil(w0[0]/st)*st;e<=w1[0];e+=st){const x=toS(e,0)[0];c.beginPath();c.moveTo(x,0);c.lineTo(x,plan.h);c.stroke();c.fillText(e,x+3,plan.h-16)}
  for(let n=Math.ceil(w0[1]/st)*st;n<=w1[1];n+=st){const y=toS(0,n)[1];c.beginPath();c.moveTo(0,y);c.lineTo(plan.w,y);c.stroke();c.fillText(n,3,y-3)}
  // design raster
  if(DES&&plan.showDes){
    if(!rast)buildRaster();
    const [rx,ry]=toS(rast.e0,rast.top),sz=rast.PXs*view.k;
    c.imageSmoothingEnabled=sz>1.5;c.globalAlpha=.7;
    c.drawImage(rast.cv,rx,ry,rast.cv.width*sz,rast.cv.height*sz);c.globalAlpha=1;
  }
  // phases
  for(let i=1;i<=4;i++){
    const p=ph(i),rings=phaseRings(i);if(!rings.length)continue;
    c.beginPath();
    for(const pts of rings){pts.forEach((q,j)=>{const [x,y]=toS(q[0],q[1]);j?c.lineTo(x,y):c.moveTo(x,y)});c.closePath()}
    if(!(DES&&plan.showDes)){c.globalAlpha=.18;c.fillStyle=p.color;c.fill();c.globalAlpha=1}
    c.strokeStyle=p.color;c.lineWidth=2.5;c.stroke();
    const big=rings.slice().sort((a,b)=>polyArea(b)-polyArea(a))[0];
    const cx=big.reduce((a,q)=>a+q[0],0)/big.length,cy=big.reduce((a,q)=>a+q[1],0)/big.length;
    const [lx,ly]=toS(cx,cy);c.textAlign='center';
    c.lineWidth=3;c.strokeStyle='rgba(0,0,0,.65)';c.font='bold 14px system-ui';c.strokeText(p.name,lx,ly);c.strokeText(fmt(phaseHa(i),1)+' ha',lx,ly+15);
    c.fillStyle=p.color;c.fillText(p.name,lx,ly);c.font='11px ui-monospace,monospace';c.fillText(fmt(phaseHa(i),1)+' ha',lx,ly+15);
  }
  // control
  const C=ctrlList();
  if(plan.line){
    c.strokeStyle=mut;c.lineWidth=1;c.setLineDash([4,4]);c.beginPath();
    let pen=false;
    for(const p of C){if(p.out){pen=false;continue}const [x,y]=toS(p.E,p.N);pen?c.lineTo(x,y):c.moveTo(x,y);pen=true}
    c.stroke();c.setLineDash([]);
  }
  c.textAlign='left';
  for(const p of C){
    const [x,y]=toS(p.E,p.N);
    c.beginPath();c.arc(x,y,p.n===plan.sel?7:4,0,7);
    c.fillStyle=p.out?bad:(p.z!=null?acc:cssv('--bg'));c.fill();c.strokeStyle=p.out?bad:acc;c.lineWidth=1.5;c.stroke();
    if(plan.labels&&(view.k>0.02||p.n===plan.sel||p.out)){c.fillStyle=txt;c.font='10px ui-monospace,monospace';c.fillText(p.n,x+6,y-6)}
  }
  // as-built check points
  if(plan.check.length){

function setInfo(t){$('#planInfo').textContent=t||'Tap a control point for details'}
(function planEvents(){
  const cv=plan.cv,ptrs=new Map();let moved=0,pd=0;
  const pos=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
  const d2=()=>{const a=[...ptrs.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])};
  function zoomAt(x,y,f){
    const w=toW(x,y);view.k=Math.max(0.005,Math.min(view.k*f,50));
    view.cx=w[0]-(x-plan.w/2)/view.k;view.cy=w[1]+(y-plan.h/2)/view.k;
  }
  cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,pos(e));moved=0;if(ptrs.size===2)pd=d2()});
  cv.addEventListener('pointermove',e=>{

    if(ptrs.size===1){const dx=p[0]-o[0],dy=p[1]-o[1];moved+=Math.abs(dx)+Math.abs(dy);view.cx-=dx/view.k;view.cy+=dy/view.k}
    ptrs.set(e.pointerId,p);
    if(ptrs.size===2){const n=d2(),a=[...ptrs.values()];zoomAt((a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2,n/pd);pd=n;moved=99}

  });
  const up=e=>{
    const was=ptrs.size,p=ptrs.get(e.pointerId);ptrs.delete(e.pointerId);
    if(was===1&&moved<8&&p)tap(p[0],p[1]);

    let best=null,bd=22;
    for(const p of ctrlList()){const s=toS(p.E,p.N),d=Math.hypot(s[0]-x,s[1]-y);if(d<bd){bd=d;best=p}}
    let hit=null,hd=16;

    if(hit&&!best){
      setInfo(`Check ${hit.n!=null?'pt '+hit.n+'  ':''}E ${hit.E.toFixed(2)}  N ${hit.N.toFixed(2)}`+(hit.dz!=null?`  dZ ${hit.dz>=0?'+':''}${hit.dz.toFixed(3)} m (${{ok:'OK',hi:'HIGH',lo:'LOW'}[hit.st]})`:'  outside design'));

    }

    drawPlan();
  }
  new ResizeObserver(()=>{if(cur==='plan'){sizePlan();if(!view.set)fitPlan();drawPlan()}}).observe($('#planBox'));
})();

function designMesh(CS,X,Y,Zc){

  for(let i=0;i<DES.n;i++){
    const ix=Math.floor((DES.E[i]-DES.e0)/CS),iy=Math.floor((DES.N[i]-DES.n0)/CS),k=iy*nx+ix;
    let c=cells.get(k);if(!c){c={e:0,n:0,z:0,c:0,ix,iy,id:0};cells.set(k,c)}
    c.e+=DES.E[i];c.n+=DES.N[i];c.z+=DES.Z[i];c.c++;
  }
  const list=[...cells.values()];list.forEach((c,i)=>c.id=i);
  const pos=new Float32Array(list.length*3),col=new Float32Array(list.length*3),span=DES.zmax-DES.zmin||1;
  for(const c of list){
    const e=c.e/c.c,n=c.n/c.c,z=c.z/c.c,j=c.id*3,rgb=rampRGB((z-DES.zmin)/span);
    pos[j]=X(e);pos[j+1]=Y(z);pos[j+2]=Zc(n);col[j]=rgb[0];col[j+1]=rgb[1];col[j+2]=rgb[2];
  }

}

function parseCsv(txt){
  const lines=txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);if(!lines.length)return [];
  const split=l=>l.split(/\t|,|;/).map(s=>s.trim());
  let cols={n:0,N:1,E:2,z:3},start=0;
  const hd=split(lines[0]).map(s=>s.toLowerCase());
  if(hd.some(s=>/[a-z]/.test(s))){
    start=1;
    hd.forEach((s,i)=>{if(/north|^n\b|\by\b|\(y\)/.test(s))cols.N=i;else if(/east|^e\b|\bx\b|\(x\)/.test(s))cols.E=i;else if(/elev|^z|\(z\)|height|level|rl/.test(s))cols.z=i;else if(/point|^id|^no|name|#/.test(s))cols.n=i});
  }
  const out=[];
  for(const l of lines.slice(start)){
    const a=split(l),n=parseInt(a[cols.n]),N=parseFloat(a[cols.N]),E=parseFloat(a[cols.E]),z=parseFloat(a[cols.z]);
    if(isNaN(n)||isNaN(N)||isNaN(E))continue;
    out.push({n,N,E,z:isNaN(z)?null:z});
  }
  return out;
}

}

    h('div',{class:'card'},h('div',{class:'mono',style:'font-size:12px;word-break:break-all'},DB_URL+ROOT),
      h('div',{class:'mut',style:'margin-top:6px'},online?'Connected. Changes sync live.':'Offline. Changes are saved on this device and sent when the connection returns.'+(pending.length?` (${pending.length} waiting)`:'')),
      h('div',{class:'row',style:'margin-top:8px'},h('button',{class:'btn',onclick:()=>{flush();if(!es||es.readyState===2)listen()}},'Retry now'),
        h('button',{class:'btn',onclick:()=>{const t=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=t;lsSet('es_theme',t);drawPlan()}},'Light / dark'))));
}

/* =====================================================================
   CHECK: as-built levels against the design surface
   ===================================================================== */
const chk={rows:[],sum:null,tol:0.1,txt:'',wir:''};
const checksOf=no=>Object.entries(S.checks).map(([id,c])=>Object.assign({id},c)).filter(c=>+c.wir===+no).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
function runCheck(pts,tol){
  const rows=[];
  for(const p of pts){
    const d=designAt(p.E,p.N);
    if(!d){rows.push({n:p.n,E:p.E,N:p.N,z:p.z,st:'out'});continue}
    const dz=p.z-d.z;
    rows.push({n:p.n,E:p.E,N:p.N,z:p.z,dz,dzd:d.z,ph:d.ph,st:Math.abs(dz)<=tol+1e-9?'ok':(dz>0?'hi':'lo')});
  }
  const v=rows.filter(r=>r.st!=='out'),n=v.length;
  const mean=n?v.reduce((a,r)=>a+r.dz,0)/n:0,sd=n?Math.sqrt(v.reduce((a,r)=>a+(r.dz-mean)**2,0)/n):0;
  const hiR=v.filter(r=>r.st==='hi'),loR=v.filter(r=>r.st==='lo');
  return {rows,sum:{n:rows.length,used:n,ok:v.filter(r=>r.st==='ok').length,hi:hiR.length,lo:loR.length,out:rows.length-n,mean,sd,
    min:n?Math.min(...v.map(r=>r.dz)):0,max:n?Math.max(...v.map(r=>r.dz)):0,
    cut:hiR.reduce((a,r)=>a+r.dz,0)*DES.cellArea,fill:-loR.reduce((a,r)=>a+r.dz,0)*DES.cellArea}};
}
function savedRows(c){
  return (c.pts||'').split(';').filter(Boolean).map(s=>{
    const a=s.split(',');const E=+a[0],N=+a[1],dz=a[2]===''?null:+a[2]/1000;
    return {E,N,dz,st:dz==null?'out':(Math.abs(dz)<=c.tol+1e-9?'ok':(dz>0?'hi':'lo'))};
  });
}
function focusPlan(rows){
  plan.check=rows;showTab('plan');
  requestAnimationFrame(()=>{
    if(!rows.length)return;
    const es=rows.map(r=>r.E),ns=rows.map(r=>r.N);
    const e0=Math.min(...es),e1=Math.max(...es),n0=Math.min(...ns),n1=Math.max(...ns);
    const pad=Math.max((e1-e0+n1-n0)*.15,40);
    view.cx=(e0+e1)/2;view.cy=(n0+n1)/2;view.k=Math.min(plan.w/(e1-e0+2*pad),plan.h/(n1-n0+2*pad));drawPlan();
  });
}
const stCls={ok:'var(--ok)',hi:'var(--bad)',lo:'var(--info)',out:'var(--mut)'};
const stTxt={ok:'OK',hi:'HIGH',lo:'LOW',out:'outside'};
function renderCheck(){
  const el=$('#t-check');el.replaceChildren();
  if(!DES){el.append(h('div',{class:'card warn'},'Design surface not loaded. Put m4_design.json next to this page, or load it in the Data tab.'));return}
  const latestMine=Object.values(S.wirs).filter(w=>w.mine).map(w=>w.no).sort((a,b)=>b-a)[0]||'';
  const wsel=chk.wir||latestMine;
  const f={};
  const wirs=Object.keys(S.wirs).map(Number).sort((a,b)=>b-a);
  const doRun=()=>{
    const pts=parseCsv(f.txt.value).filter(p=>p.z!=null);
    if(!pts.length){alert('No usable points. Expected rows: Point, Northing, Easting, Elevation');return}
    const tol=+f.tol.value||0.1;
    chk.txt=f.txt.value;chk.wir=f.wir.value;chk.tol=tol;
    const r=runCheck(pts,tol);chk.rows=r.rows;chk.sum=r.sum;plan.check=r.rows;
    renderCheck();
  };
  el.append(h('h2',{},'As-built vs design'),
    h('div',{class:'card'},
      h('div',{class:'row'},
        h('label',{class:'f sp'},'Tolerance ± m',f.tol=h('input',{type:'number',step:'0.01',value:S.meta.tol||0.1,onchange:e=>put('meta/tol',+e.target.value||0.1)})),
        h('label',{class:'f sp'},'WIR',f.wir=h('select',{},...wirs.map(n=>h('option',{value:n,selected:+wsel===n},'WIR '+n))))),
      h('label',{class:'f'},'As-built points: Point, Northing, Easting, Elevation',f.txt=h('textarea',{value:chk.txt,placeholder:'1, 2761500.20, 668100.55, 636.42\n2, 2761500.25, 668101.55, 636.40'})),
      h('div',{class:'row'},
        h('input',{type:'file',accept:'.csv,.txt',onchange:e=>{const fl=e.target.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>{f.txt.value=String(r.result);doRun()};r.readAsText(fl)}}),
        h('span',{class:'sp'}),
        h('button',{class:'btn pri',onclick:doRun},'Run check'))),
    h('div',{class:'mut',style:'font-size:12px;margin:-4px 0 10px'},'dZ = as-built minus design. HIGH means above design (cut), LOW means below design (fill). Design Z is interpolated between the 10 m grid points.'));
  if(chk.sum){
    const s=chk.sum,pc=s.used?s.ok/s.used*100:0,good=s.used&&s.ok===s.used;
    el.append(h('h2',{},'Result'),
      h('div',{class:'grid'},
        stat(`${s.ok}/${s.used}`,`within ±${chk.tol} m (${fmt(pc)}%)`,good?'':'warn'),
        stat(s.hi,'high (above design)'),stat(s.lo,'low (below design)'),stat(s.out,'outside design area')),
      h('div',{class:'card mono',style:'font-size:13px'},
        `Mean dZ ${s.mean>=0?'+':''}${s.mean.toFixed(3)} m · SD ${s.sd.toFixed(3)} · min ${s.min.toFixed(3)} · max ${s.max.toFixed(3)}`,
        h('div',{class:'mut',style:'font-size:12px;margin-top:4px'},`Indicative only, if each point stood for one ${fmt(DES.cellArea,0)} m² grid cell: cut ${fmt(s.cut)} m³, fill ${fmt(s.fill)} m³.`)),
      h('div',{class:'row',style:'margin-bottom:10px'},
        h('button',{class:'btn pri',onclick:()=>{
          const id='k'+Date.now().toString(36);
          put('checks/'+id,{wir:+f.wir.value,date:today(),tol:chk.tol,n:s.n,used:s.used,ok:s.ok,hi:s.hi,lo:s.lo,out:s.out,mean:+s.mean.toFixed(3),min:+s.min.toFixed(3),max:+s.max.toFixed(3),
            pts:chk.rows.slice(0,3000).map(r=>[r.E.toFixed(2),r.N.toFixed(2),r.dz==null?'':Math.round(r.dz*1000)].join(',')).join(';')});
          alert('Saved to WIR '+f.wir.value);
        }},'Save to WIR'),
        h('button',{class:'btn',onclick:()=>focusPlan(chk.rows)},'Show on plan')));
    const show=chk.rows.slice().sort((a,b)=>Math.abs(b.dz||0)-Math.abs(a.dz||0)).slice(0,200);
    const trs=show.map(r=>h('tr',{},h('td',{},r.n),h('td',{class:'n'},r.z.toFixed(3)),h('td',{class:'n'},r.dzd!=null?r.dzd.toFixed(3):'—'),
      h('td',{class:'n'},r.dz!=null?(r.dz>=0?'+':'')+r.dz.toFixed(3):'—'),h('td',{style:'color:'+stCls[r.st]+';font-weight:600'},stTxt[r.st])));
    const thead=h('thead',{},h('tr',{},h('th',{},'Pt'),h('th',{class:'n'},'Z as-built'),h('th',{class:'n'},'Z design'),h('th',{class:'n'},'dZ'),h('th',{},'')));
    el.append(h('div',{class:'card tbl'},h('table',{},thead,h('tbody',{},trs)),
      chk.rows.length>200?h('div',{class:'mut',style:'font-size:12px;margin-top:6px'},'Showing the 200 largest deviations of '+chk.rows.length+'.'):null));
  }
  const saved=Object.entries(S.checks).map(([id,c])=>Object.assign({id},c)).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.id.localeCompare(a.id));
  el.append(h('h2',{},'Saved checks'));
  if(!saved.length)el.append(h('div',{class:'card mut'},'None yet.'));
  for(const c of saved)el.append(h('div',{class:'card'},
    h('div',{class:'row'},h('b',{},'WIR '+c.wir),h('span',{class:'mut'},c.date),h('span',{class:'sp'}),
      h('button',{class:'btn sm',onclick:()=>focusPlan(savedRows(c))},'Plan'),
      h('button',{class:'btn sm dng',onclick:()=>{if(confirm('Delete this check?'))put('checks/'+c.id,null)}},'Delete')),
    h('div',{class:'mono',style:'font-size:12px'},`${c.ok}/${c.used} within ±${c.tol} m · ${c.hi||0} high · ${c.lo||0} low · ${c.out||0} outside · mean ${c.mean>=0?'+':''}${c.mean} m`)));
}

/* ---------- boot ---------- */
(function(){const t=lsGet('es_theme',null);if(t)document.documentElement.dataset.theme=t})();
setStatus(false,'connecting…');
listen();
loadDesign();
showTab(cur);
</script>
